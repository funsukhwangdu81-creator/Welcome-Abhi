<style>

.mut{color:var(--mut);font-size:.93rem}

.lk{background:none;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer;flex:1;padding:0}div.lrow{cursor:default}.dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--ln)}.dot.ok{background:var(--ok);border-color:var(--ok)}

.opt::before{content:counter(o,upper-alpha);position:absolute;left:16px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--ln);font-size:.85rem;font-weight:700;color:var(--mut)}
.opt:hover{border-color:var(--ac)}.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,var(--card))}.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,var(--card))}
.opt.ok::before{background:var(--ok);border-color:var(--ok);color:#fff}.opt.bad::before{background:var(--bad);border-color:var(--bad);color:#fff}
.q{font-size:1.7rem;line-height:1.25;margin:24px 0 16px}.top{display:flex;justify-content:space-between;color:var(--mut);font-size:.9rem}
.bar{height:6px;background:var(--ln);border-radius:9px;margin:10px 0}.bar i{display:block;height:100%;background:var(--ac);border-radius:9px;transition:width .3s}
.ex{background:var(--acs);border-left:3px solid var(--ac);border-radius:4px 12px 12px 4px;padding:10px 14px;margin:10px 0;display:flex;justify-content:space-between;gap:10px;align-items:center}
.wod{border-left:4px solid var(--ac)}.wod h2{font-size:1.8rem;margin:4px 0}
.tag{font-size:.8rem;border:1px solid var(--ln);border-radius:20px;padding:1px 10px;color:var(--mut)}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--ln);border-radius:12px;padding:11px 12px;margin:6px 0}
label.c{display:inline-flex;gap:6px;align-items:center;margin:4px 14px 4px 0;font-size:.95rem}label.c input{width:auto;margin:0}
.kw{display:inline-block;margin:3px 6px 3px 0;padding:1px 10px;border-radius:20px;font-size:.9rem}.kw.y{background:color-mix(in srgb,var(--ok) 20%,var(--card))}.kw.n{background:color-mix(in srgb,var(--bad) 20%,var(--card))}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
#bb .btn{padding:6px 16px;margin:0 0 4px}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid var(--ln);margin:4px 8px 4px 0;cursor:pointer}.wk{display:flex;gap:8px;align-items:flex-end;height:80px}.wk div{flex:1;background:var(--ac);border-radius:6px 6px 0 0;opacity:.85}.wk span{text-align:center;font-size:.75rem;color:var(--mut)}
.sheet{background:#fff;color:#000;padding:24px;border-radius:8px;font-size:15px;line-height:1.5}.sheet h2{font-size:1.2rem}.pb{page-break-before:always}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
@media print{nav,.noprint{display:none!important}body{background:#fff}main{margin:0;padding:0;max-width:none}.sheet{padding:0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
const $=s=>document.querySelector(s),A=$('#app');
const D=()=>new Date().toLocaleDateString('en-CA');
let S;try{S=JSON.parse(localStorage.getItem('eng1'))}catch(e){}
S=S||{plan:null,done:{},mist:[],streak:0,last:''};
const save=()=>{try{localStorage.setItem('eng1',JSON.stringify(S))}catch(e){}};
const sh=a=>[...a].sort(()=>Math.random()-.5);
const speak=t=>{try{const u=new SpeechSynthesisUtterance(t);u.lang='en-IN';speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}};
const P={home:'M3 12l9-9 9 9M5 10v10h14V10',book:'M4 4h12a3 3 0 013 3v13H7a3 3 0 01-3-3zM4 17a3 3 0 013-3h12',flask:'M9 3h6M10 3v6l-5 9a2 2 0 002 3h10a2 2 0 002-3l-5-9V3',cal:'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4',chart:'M4 20V10M10 20V4M16 20v-7M22 20H2',spk:'M4 9v6h4l5 4V5L8 9zM16 9a4 4 0 010 6'};
Object.assign(P,{bone:'M17 10c.7-.7 1.69 0 2.5 0a2.5 2.5 0 101.2-4.8 2.5 2.5 0 10-4.8 1.2c0 .8.7 1.8 0 2.5l-7 7c-.7.7-1.69 0-2.5 0a2.5 2.5 0 10-1.2 4.8 2.5 2.5 0 104.8-1.2c0-.8-.7-1.8 0-2.5z',heart:'M20.8 5.6a5 5 0 00-7.1 0L12 7.3l-1.7-1.7a5 5 0 00-7.1 7.1L12 21.5l8.8-8.8a5 5 0 000-7.1z',brain:'M12 3a5 5 0 00-5 5v1a4 4 0 000 8 4 4 0 005 3.5V3zM12 3a5 5 0 015 5v1a4 4 0 010 8 4 4 0 01-5 3.5',pulse:'M22 12h-4l-3 9L9 3l-3 9H2',layers:'M12 3l9 5-9 5-9-5zM3 13l9 5 9-5',redo:'M3 12a9 9 0 0115-6.7L21 8M21 3v5h-5M21 12a9 9 0 01-15 6.7L3 16M3 21v-5h5'});
const SI={Anatomy:'bone',Physiology:'heart',Biochemistry:'flask',Psychology:'brain',BOP:'pulse'};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ic=n=>`<svg class="i" viewBox="0 0 24 24"><path d="${P[n]}"/></svg>`;
const Q=(q,o,a,e)=>({q,o,a,e});
const LS=[
{id:'wh',t:'Making questions with Wh-words',tier:1,cards:[
{h:'Wh-words ka matlab',b:'What = kya, Where = kahan, When = kab, Why = kyun, Who = kaun, How = kaise.',x:['Where do you live?','Why are you late?']},
{h:'Question ka structure',b:'Pehle Wh-word, phir do/does/did/is/are, phir subject, phir verb.',x:['What do you study?','How does he travel?']},
{h:'Common galti',b:'Hindi jaisa order mat likho. "Where you live?" galat hai, helping verb zaroor lagao.',x:['Where do you live?']}],
qz:[Q('Tum kahan rehte ho?',['Where you live?','Where do you live?','You live where do?','Where does you live?'],1,'Wh-word + do + subject + verb.'),Q('Choose the correct sentence.',['Why she is crying?','Why is she crying?','Why crying is she?','She why is crying?'],1,'Wh-word ke baad is/are/do aata hai.'),Q('"Kab" ke liye kaunsa word?',['Who','Where','When','Why'],2,'When = kab.')]},
{id:'do',t:'Do, Does and Did',tier:1,cards:[
{h:'Kab kaunsa?',b:'Do: I, you, we, they. Does: he, she, it. Did: past (kal, pehle).',x:['Do they play cricket?','Does she study anatomy?']},
{h:'Ek important rule',b:'Does ya did ke baad verb simple rehta hai. "Does she plays" galat hai.',x:['Did you go to college?','Does he know the answer?']}],
qz:[Q('___ he come daily?',['Do','Does','Did','Is'],1,'He ke saath does.'),Q('Choose the correct sentence.',['Did you went there?','Did you go there?','Do you went there?','Does you go there?'],1,'Did ke baad verb simple (go).'),Q('___ they study together?',['Does','Is','Do','Has'],2,'They ke saath do.')]},
{id:'sp',t:'Spelling traps',tier:1,cards:[
{h:'Ye words yaad rakho',b:'receive, separate, necessary, government, knowledge, exercise. Inme galti sabse zyada hoti hai.',x:['receive','separate','necessary']},
{h:'Yaad karne ka tarika',b:'Receive: i se pehle e, jab c ke baad aaye. Separate: "a rat" beech mein hai. Necessary: ek c aur do s.',x:['government','knowledge']}],
qz:[Q('Sahi spelling chuno.',['recieve','receive','receeve','reseive'],1,'c ke baad ei.'),Q('Sahi spelling chuno.',['seperate','separate','separete','saparate'],1,'sep-a-rate.'),Q('Sahi spelling chuno.',['neccessary','necesary','necessary','nessesary'],2,'1 c, 2 s.')]},
{id:'od',t:'Sentence order',tier:2,cards:[
{h:'Hindi aur English ka farak',b:'Hindi mein verb aakhir mein aata hai. English mein Subject, Verb, Object ka order hota hai.',x:['I read a book.','She likes physiology.']},
{h:'Practice',b:'Hindi sentence ko pehle todo: kaun (subject), kya kiya (verb), kisko (object). Phir English mein is order mein rakho.',x:['Main roz exercise karta hoon = I exercise daily.']}],
qz:[Q('"Mujhe physiology pasand hai."',['Physiology like I.','I like physiology.','Like I physiology.','Physiology I like it.'],1,'Subject, verb, object.'),Q('Choose the correct sentence.',['He anatomy studies.','He studies anatomy.','Studies he anatomy.','Anatomy he studies.'],1,'He (S) studies (V) anatomy (O).'),Q('"Wo roz college jaata hai."',['He goes to college daily.','He daily college goes.','Goes he college daily.','College he goes daily.'],0,'S + V + place + time.')]},
{id:'ar',t:'Articles: a, an, the',tier:2,cards:[
{h:'A aur an',b:'Spelling nahi, awaaz dekho. Vowel awaaz se pehle an, baaki par a.',x:['an apple','an hour','a university']},
{h:'The kab?',b:'Jab hum kisi khaas cheez ki baat karein jo dono ko pata ho.',x:['The patient is resting.','Open the book.']}],
qz:[Q('___ hour',['a','an','the','no article'],1,'Hour ka h silent hai.'),Q('___ university',['an','a','the','no article'],1,'Uni ki awaaz "yu" hai.'),Q('He is ___ honest man.',['a','an','the','no article'],1,'Honest ka h silent hai.')]},
{id:'ex',t:'Writing exam answers',tier:2,cards:[
{h:'Answer ka format',b:'Pehle definition, phir points, aakhir mein example ya conclusion.',x:['Definition. Point 1. Point 2. Conclusion.']},
{h:'Points kaise likhein',b:'Chhote heading, numbering, aur har point mein ek hi idea. Lambe sentence se bacho.',x:['1. Origin 2. Insertion 3. Action']}],
qz:[Q('Long answer ki shuruaat kisse karein?',['Example','Definition','Conclusion','Diagram'],1,'Definition se shuru karna sabse accha hai.'),Q('Points likhne ka best tarika?',['Ek lamba paragraph','Numbered short points','Sirf diagram','Random lines'],1,'Short numbered points padhne mein easy.'),Q('Answer ka aakhir mein kya aata hai?',['Conclusion','Question dobara','Rough work','Kuch nahi'],0,'Conclusion se answer poora lagta hai.')]},
{id:'bv',t:'BPT movement words',tier:2,cards:[
{h:'Joint ki movements',b:'Flexion: angle kam karna. Extension: angle badhana. Abduction: body se door. Adduction: body ke paas.',x:['Flexion of the elbow','Abduction of the shoulder']},
{h:'Spelling dhyan se',b:'abduction aur adduction mein ek hi letter ka farak hai: b aur d.',x:['abduction','adduction']}],
qz:[Q('Arm ko body se door le jana?',['Adduction','Abduction','Flexion','Extension'],1,'Ab = away.'),Q('Elbow mod kar angle kam karna?',['Flexion','Extension','Abduction','Rotation'],0,'Flexion angle kam karta hai.'),Q('Hand ko body ke paas lana?',['Abduction','Extension','Adduction','Flexion'],2,'Ad = towards.')]},
{id:'tn',t:'Present simple and continuous',tier:3,cards:[
{h:'Do tarike',b:'Roz ki aadat ke liye simple: I study daily. Abhi chal raha kaam: I am studying now.',x:['I study every day.','I am studying now.']}],
qz:[Q('Right now: She ___ a book.',['reads','is reading','read','reading'],1,'Abhi ke liye is + ing.'),Q('Every day: He ___ to college.',['is going','goes','go','going'],1,'Aadat ke liye simple present.'),Q('I ___ anatomy these days.',['study','am studying','studies','studied'],1,'Ye din chal rahe hain: continuous.')]}];
LS.push(
{id:'pr',t:'In, on, at',tier:2,cards:[{h:'Teen prepositions',b:'In: bada space, mahina, saal. On: din aur surface. At: chhoti jagah ya exact time.',x:['I live in Haldwani.','The test is on Monday.','Class starts at 9 am.']},{h:'Hindi ki galti',b:'Hindi mein sab jagah "mein" hota hai, English mein jagah ke hisaab se alag word lagta hai.',x:['I study in the morning.','She is at home.']}],qz:[Q('The test is ___ Monday.',['in','on','at','by'],1,'Din ke saath on.'),Q('I wake up ___ 6 am.',['at','on','in','to'],0,'Exact time ke saath at.'),Q('She lives ___ Delhi.',['at','on','in','by'],2,'Shehar ke saath in.')]},
{id:'sv',t:'Subject-verb agreement',tier:2,cards:[{h:'Singular aur plural',b:'He, she, it ke saath verb mein s lagta hai. They, we, you ke saath simple verb.',x:['He studies daily.','They study daily.']},{h:'Dhyan rakho',b:'Each, every, everyone ke saath singular verb aata hai.',x:['Everyone is ready.','Each student has a book.']}],qz:[Q('The students ___ in the library.',['is','are','was','has'],1,'Students plural hai.'),Q('Each of the boys ___ a book.',['have','has','are','were'],1,'Each ke saath singular.'),Q('My brother ___ physiotherapy.',['study','studies','studying','are study'],1,'Brother singular hai.')]},
{id:'pf',t:'Past and future',tier:2,cards:[{h:'Past aur future',b:'Past: verb ka doosra form (went, studied). Future: will + verb.',x:['I studied anatomy yesterday.','I will study tomorrow.']},{h:'Irregular verbs',b:'go-went, eat-ate, see-saw, write-wrote, take-took.',x:['She wrote the answer.','He took the test.']}],qz:[Q('Yesterday I ___ to college.',['go','went','gone','going'],1,'Go ka past went.'),Q('Tomorrow she ___ come.',['will','did','was','has'],0,'Future mein will.'),Q('Past of "write"?',['writed','wrote','written','writes'],1,'Write, wrote, written.')]},
{id:'tg',t:'Tag questions',tier:3,cards:[{h:'Chhota sawal aakhir mein',b:'Positive sentence ke baad negative tag, negative ke baad positive tag.',x:["You study daily, don't you?",'He is not here, is he?']},{h:'Helping verb same rakho',b:'Jo helping verb sentence mein ho, wahi tag mein aata hai.',x:["She is late, isn't she?"]}],qz:[Q('You like anatomy, ___?',["don't you","do you","aren't you","isn't it"],0,'Positive ke baad negative tag.'),Q('He is not here, ___?',["isn't he","is he","does he","was he"],1,'Negative ke baad positive tag.'),Q('They play cricket, ___?',["do they","don't they","aren't they","didn't they"],1,'Play ke liye do/don\'t.')]},
{id:'pu',t:'Punctuation and capitals',tier:2,cards:[{h:'Basic signs',b:'Full stop (.) sentence ke end par. Question mark (?) sawal ke end par. Comma (,) list ke items alag karne ke liye.',x:['I study anatomy, physiology and psychology.']},{h:'Capital letter',b:'Sentence ki shuruaat, naam, aur I hamesha capital.',x:['My name is Abhi.']}],qz:[Q('Choose the correct sentence.',['what is your name','What is your name?','What is your name.','what is your name?'],1,'Capital letter aur question mark.'),Q('Kaunsa sahi hai?',['i am a student.','I am a student.','I am a Student','i am a student'],1,'I capital, sentence capital se shuru.'),Q('Comma ka use?',['List ke items alag karne','Question poochne','Sentence khatam karne','Spelling theek karne'],0)]},

if(lc)h+=`<button class="lrow" onclick="go('chap','${S.lastc}')"><span><b>Continue: ${lc.n}</b><small>${sb(S.lastc.split('|')[0]).n}</small></span></button>`;
LB().subs.forEach(s=>s.chs.forEach(c=>{if(c.st==2&&c.done){const r=c.rv||0;if(r<4&&t>=new Date(new Date(c.done).getTime()+gap[r]*864e5).toLocaleDateString('en-CA'))h+=`<div class="lrow"><span><b>Revise: ${c.n}</b><small>${s.n}</small></span><button class="btn" style="margin:0" onclick="rvDone('${s.id}|${c.id}')">Revised</button></div>`}}));return h};
function rvDone(a){chp(a).rv=(chp(a).rv||0)+1;save();go('home',0,1)}
V.lib=function(){const L=LB().subs;A.innerHTML=`<h1>Library</h1><p class="mut">Your subjects, chapters, lectures and books in one place.</p><div class="card"><input id="ln" placeholder="New subject name"><button class="btn" onclick="addSub($('#ln').value)">Add subject</button>${L.length?'':`<button class="btn g" onclick="['Anatomy','Physiology','Biochemistry','Psychology','BOP'].forEach(addSub)">Add my 5 subjects</button>`}</div>`+'<div class="grid">'+L.map(s=>{const d=s.chs.filter(c=>c.st==2).length;return`<button class="subc" style="--c:${SC[s.n]||'var(--ac)'}" onclick="go('sub','${s.id}')">${ring(s.chs.length?d/s.chs.length:0)}<b>${s.n}</b><small>${d} of ${s.chs.length} chapters done</small></button>`}).join('')+'</div>'};
function addSub(n){n=esc(String(n).trim());if(!n)return;LB().subs.push({id:uid(),n,chs:[]});save();V.lib()}
V.sub=function(id){const s=sb(id);if(!s){go('lib');return}A.innerHTML=`<h1>${s.n}</h1><div class="card"><input id="cn" placeholder="New chapter name"><button class="btn" onclick="addChap('${id}')">Add chapter</button><button class="btn g" onclick="renSub('${id}')">Rename subject</button><button class="btn g" onclick="delSub('${id}')">Delete subject</button></div>`+(s.chs.map((c,i)=>`<div class="lrow"><button class="lk" onclick="go('chap','${id}|${c.id}')"><b>${c.n}</b><small>${['Not started','Reading','Done'][c.st]}${c.pr?', important':''}, ${c.lec.length} lectures, ${c.bk.length} books</small></button><span><button class="btn g" style="padding:2px 10px;margin:0" onclick="mvC('${id}',${i},-1)">Up</button> <button class="btn g" style="padding:2px 10px;margin:0" onclick="mvC('${id}',${i},1)">Down</button></span></div>`).join('')||'<p class="mut">No chapters yet. Add the first one above.</p>')};
function addChap(id){const n=esc($('#cn').value.trim());if(!n)return;sb(id).chs.push({id:uid(),n,st:0,pr:0,lec:[],bk:[],nt:''});save();V.sub(id)}
function renSub(id){const x=sb(id),n=prompt('Subject name',u(x.n));if(n&&n.trim()){x.n=esc(n.trim());save();V.sub(id)}}
function delSub(id){if(!confirm('Delete this subject and all its chapters?'))return;LB().subs=LB().subs.filter(x=>x.id!=id);save();go('lib')}
function mvC(id,i,d){const a=sb(id).chs,j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();V.sub(id)}
V.chap=function(a){const c=chp(a),s=c&&sb(a.split('|')[0]);if(!c){go('lib');return}S.lastc=a;save();
const yt=x=>{const m=x.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);return m?m[1]:null};
A.innerHTML=`<h1>${c.n}</h1><p class="mut">${s.n}</p>
<div class="card"><label>Status</label><select onchange="setSt('${a}',this.value)">${['Not started','Reading','Done'].map((x,k)=>`<option value="${k}" ${c.st==k?'selected':''}>${x}</option>`).join('')}</select><label class="c"><input type="checkbox" ${c.pr?'checked':''} onchange="chp('${a}').pr=this.checked?1:0;save()">Important for exam</label><br><button class="btn" onclick="chPractice('${a}')">Practice this chapter</button><button class="btn g" onclick="renChap('${a}')">Rename</button><button class="btn g" onclick="delChap('${a}')">Delete chapter</button></div>
<h2>Lectures</h2>${c.lec.length?`<p class="mut">${c.lec.filter(x=>x.w).length} of ${c.lec.length} watched</p>`:''}${c.lec.map((l,i)=>`<div class="lec" onclick="go('play','${a}|${i}')"><div class="th">${thumb(l.u)}${l.w?'<i class="wt"></i>':''}</div><div style="flex:1"><b>${l.t}</b><small>${l.w?'Watched':l.pos?'Resume from '+fmt(l.pos):'Not watched'}</small></div><button class="btn g" style="padding:2px 10px;margin:0" onclick="event.stopPropagation();delLec('${a}',${i})">Delete</button></div>`).join('')||'<p class="mut">No lectures yet.</p>'}
<div class="card"><h2>Add a YouTube playlist</h2><input id="pl" placeholder="Paste the playlist link"><button class="btn" onclick="addPl('${a}')">Add all videos</button><div id="pls" class="mut"></div><details><summary class="mut">Add many links</summary><textarea id="ml" rows="4" placeholder="One YouTube link per line. Optional title: Title|link"></textarea><button class="btn g" onclick="addMany('${a}')">Add links</button></details><details><summary class="mut">Add one lecture</summary><input id="lt" placeholder="Lecture title"><input id="lu" placeholder="Paste the link (YouTube, Drive or any site)"><button class="btn g" onclick="addLec('${a}')">Add lecture</button></details></div>
<h2>Books and PDFs</h2>${c.bk.map((b,i)=>`<div class="card"><b>${b.t}</b><br>${b.f?`<button class="btn" onclick="openF('${b.f}')">Open file</button>`:`<a class="btn" href="${b.u}" target="_blank" rel="noopener">Open link</a>`}<button class="btn g" onclick="delBk('${a}',${i})">Delete</button></div>`).join('')||'<p class="mut">No books yet.</p>'}
<div class="card"><input id="bt" placeholder="Book or PDF title"><input id="bu" placeholder="Paste a link (Google Drive etc.)"><button class="btn" onclick="addBk('${a}',0)">Add link</button><p class="mut">Or pick a PDF from this device. It stays only on this device and is not part of the backup.</p><input id="bf" type="file" accept="application/pdf" onchange="addBk('${a}',1)"></div>
<h2>Chapter notes</h2><div class="card"><textarea id="cnt" rows="4" placeholder="Your notes for this chapter">${c.nt||''}</textarea><button class="btn" onclick="chp('${a}').nt=esc($('#cnt').value.trim());save();alert('Saved.')">Save notes</button></div>`};
function setSt(a,v){const c=chp(a);c.st=+v;if(c.st==2){c.done=D();c.rv=0}save();V.chap(a)}
function addLec(a){const c=chp(a),t=esc($('#lt').value.trim());let x=$('#lu').value.trim();if(!t||!x){alert('Add a title and a link.');return}if(!/^https?:\/\//i.test(x))x='https://'+x;c.lec.push({id:uid(),t,u:esc(x),w:0,nt:''});save();V.chap(a)}
function delLec(a,i){if(!confirm('Delete this lecture?'))return;chp(a).lec.splice(i,1);save();V.chap(a)}
function saveLn(a,i){chp(a).lec[i].nt=esc($('#ln'+i).value.trim());save();V.chap(a)}
async function addBk(a,f){const c=chp(a),t=esc($('#bt').value.trim());if(!t){alert('Add a title first.');$('#bf').value='';return}
if(f){const x=$('#bf').files[0];if(!x)return;if(x.size>30e6&&!confirm('This file is large and may fill your browser storage. Save it anyway?'))return;const k='f'+uid();try{await fput(k,x)}catch(e){alert('Could not save this file here.');return}c.bk.push({id:uid(),t,f:k})}
else{let x=$('#bu').value.trim();if(!x){alert('Paste a link.');return}if(!/^https?:\/\//i.test(x))x='https://'+x;c.bk.push({id:uid(),t,u:esc(x)})}save();V.chap(a)}
function delBk(a,i){if(!confirm('Delete this book?'))return;const b=chp(a).bk.splice(i,1)[0];if(b.f)fdel(b.f);save();V.chap(a)}
function renChap(a){const c=chp(a),n=prompt('Chapter name',u(c.n));if(n&&n.trim()){c.n=esc(n.trim());save();V.chap(a)}}
function delChap(a){if(!confirm('Delete this chapter and everything in it?'))return;const [i,j]=a.split('|'),x=sb(i);x.chs=x.chs.filter(y=>y.id!=j);save();go('sub',i)}
function chPractice(a){const c=chp(a),x=sb(a.split('|')[0]),k=Object.keys(BANK).find(y=>y.toLowerCase()==x.n.toLowerCase()),b=k?BANK[k].mcq.filter(q=>q.ch&&q.ch.toLowerCase()==c.n.toLowerCase()):[];if(!b.length){alert('No questions are tagged with this chapter yet. In Subjects, open My questions and add questions with this exact subject and chapter name.');return}quiz(sh(b),u(c.n),0)}

let YP=null,YT_TIMER=null;
const ytid=x=>{const m=(x||'').match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);return m?m[1]:null},thumb=x=>ytid(x)?`<img src="https://i.ytimg.com/vi/${ytid(x)}/mqdefault.jpg" alt="">`:'<div class="ph"></div>';
const fmt=t=>{t=Math.floor(t||0);const h=Math.floor(t/3600),m=Math.floor(t%3600/60),q=t%60;return(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(q).padStart(2,'0')};
const lec=a=>{const p=a.split('|'),c=chp(p[0]+'|'+p[1]);return c&&c.lec[+p[2]]};
const ytReady=()=>new Promise((ok,no)=>{if(window.YT&&YT.Player)return ok();const o=window.onYouTubeIframeAPIReady;window.onYouTubeIframeAPIReady=()=>{o&&o();ok()};if(!document.getElementById('yta')){const e=document.createElement('script');e.id='yta';e.src='https://www.youtube.com/iframe_api';document.head.appendChild(e)}setTimeout(()=>{if(!(window.YT&&YT.Player))no()},10000)});
const seekLnk=l=>(l.nt||'').replace(/(\d{1,2}):(\d{2})(?::(\d{2}))?/g,(m,a,b,c)=>{const t=c!=null?+a*3600+ +b*60+ +c:+a*60+ +b;return`<a href="#" onclick="seek(${t});return false">${m}</a>`}).replace(/\n/g,'<br>');
function seek(t){if(YP&&YP.seekTo){YP.seekTo(t,true);scrollTo(0,0)}}
function spd(x){try{YP.setPlaybackRate(x)}catch(e){}}
function savePn(ca,i){const l=chp(ca).lec[i];l.nt=esc($('#pn').value.trim());save();$('#pnl').innerHTML=seekLnk(l)}
function noteNow(a){const p=a.split('|'),ca=p[0]+'|'+p[1];let t=0;try{t=Math.floor(YP.getCurrentTime())}catch(e){}const n=$('#pn');n.value+=(n.value?'\n':'')+fmt(t)+' ';savePn(ca,+p[2]);n.focus()}
V.play=function(a){const p=a.split('|'),ca=p[0]+'|'+p[1],c=chp(ca),i=+p[2],l=c&&c.lec[i];if(!l){go('lib');return}S.lastl=a;S.lastc=ca;save();
const id=ytid(l.u),dr=/drive\.google\.com\/file\/d\/([\w-]+)/.exec(l.u);
A.innerHTML=`<h1 style="font-size:1.6rem">${l.t}</h1><p class="mut">${c.n}</p><div class="vid">${id?'<div id="yt"></div>':dr?`<iframe src="https://drive.google.com/file/d/${dr[1]}/preview" allowfullscreen></iframe>`:`<div class="ph" style="display:grid;place-items:center"><a class="btn" href="${l.u}" target="_blank" rel="noopener">Open lecture</a></div>`}</div><div id="yerr" class="mut"></div>
${id?`<div class="ctl"><span class="mut">Speed</span>${[1,1.25,1.5,2].map(x=>`<button class="btn g" onclick="spd(${x})">${x}x</button>`).join('')}<button class="btn" onclick="noteNow('${a}')">Add note at this time</button></div>`:''}
<div class="ctl"><button class="btn g" onclick="${i>0?`go('play','${ca}|${i-1}')`:`go('chap','${ca}')`}">${i>0?'Previous':'Chapter'}</button>${i<c.lec.length-1?`<button class="btn" onclick="go('play','${ca}|${i+1}')">Next lecture</button>`:''}</div>
<div class="card"><h2>My notes</h2><textarea id="pn" rows="4" placeholder="Tap Add note at this time, or type 12:30 and your note">${l.nt||''}</textarea><button class="btn g" onclick="savePn('${ca}',${i})">Save notes</button><p id="pnl">${seekLnk(l)}</p></div>
<h2>In this chapter</h2>${c.lec.map((x,k)=>`<div class="lec ${k==i?'cur':''}" onclick="go('play','${ca}|${k}')"><div class="th">${thumb(x.u)}${x.w?'<i class="wt"></i>':''}</div><div><b>${x.t}</b><small>${x.w?'Watched':x.pos?'Resume from '+fmt(x.pos):''}</small></div></div>`).join('')}`;
if(id)ytReady().then(()=>{if(!$('#yt'))return;YP=new YT.Player('yt',{videoId:id,width:'100%',height:'100%',playerVars:{rel:0,playsinline:1,start:Math.floor(l.pos||0)},events:{onError:()=>{$('#yerr').innerHTML='This video cannot be played here. <a href="'+l.u+'" target="_blank" rel="noopener">Open on YouTube</a>'},onStateChange:e=>{if(e.data===0){l.pos=0;l.w=1;save();if(i<c.lec.length-1)go('play',ca+'|'+(i+1))}}}});
YT_TIMER=setInterval(()=>{try{const t=YP.getCurrentTime(),d=YP.getDuration();if(t>0){l.pos=t;if(d&&t/d>=.9)l.w=1;save()}}catch(e){}},5000)}).catch(()=>{$('#yerr').textContent='Could not load the player. Check your internet.'})};
async function addYt(a,pairs,st){const c=chp(a),T=[];for(let i=0;i<pairs.length;i+=8){const r=await Promise.all(pairs.slice(i,i+8).map(async q=>{if(q[1])return q[1];try{return(await(await fetch('https://www.youtube.com/oembed?format=json&url='+encodeURIComponent('https://www.youtube.com/watch?v='+q[0]))).json()).title}catch(e){return''}}));T.push(...r);st.textContent='Loaded '+T.length+' of '+pairs.length+'...'}
pairs.forEach((q,k)=>c.lec.push({id:uid(),t:esc(T[k]||'Lecture '+(c.lec.length+1)),u:'https://www.youtube.com/watch?v='+q[0],w:0,nt:'',pos:0}));save();V.chap(a)}
async function addPl(a){const m=$('#pl').value.match(/[?&]list=([\w-]+)/),st=$('#pls');if(!m){st.textContent='Paste a YouTube playlist link (it has list= in it).';return}st.textContent='Loading playlist...';
try{await ytReady();const ids=await new Promise((ok,no)=>{const h=document.createElement('div');h.id='hp';h.style.cssText='position:absolute;left:-9999px;width:320px;height:180px';document.body.appendChild(h);let pl;const done=(r,e)=>{try{pl.destroy()}catch(x){}h.remove();e?no(e):ok(r)};
pl=new YT.Player('hp',{width:320,height:180,playerVars:{listType:'playlist',list:m[1]},events:{onReady:()=>{let n=0;const t=setInterval(()=>{let r=[];try{r=pl.getPlaylist()||[]}catch(x){}if(r.length||++n>20){clearInterval(t);r.length?done(r):done(0,1)}},500)},onError:()=>done(0,1)}})});
await addYt(a,ids.map(x=>[x,'']),st)}catch(e){st.textContent='Could not read this playlist. Use Add many links instead.'}}
async function addMany(a){const st=$('#pls'),pr=[];$('#ml').value.split('\n').forEach(l=>{const q=l.split('|'),url=(q.pop()||'').trim(),m=ytid(url);if(m)pr.push([m,q.join('|').trim()])});if(!pr.length){st.textContent='No YouTube links found.';return}st.textContent='Loading titles...';await addYt(a,pr,st)}
boot();go('home');try{navigator.serviceWorker.register('sw.js')}catch(e){}
</script></body></html>
